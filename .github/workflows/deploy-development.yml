name: Deploy application

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.target_environment || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (!inputs.target_environment || inputs.target_environment == 'development' || inputs.target_environment == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.target_environment || 'development' }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.target_environment == 'production'
        with:
          persist-credentials: false

      - name: Require actual production reviewer protection
        if: inputs.target_environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/environments/production" \
            | python3 src/backend/platform/deployment/production_protection.py

      - name: Require successful CI for this exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&branch=main&per_page=100")" \
            || { echo 'Could not read CI status for this revision.' >&2; exit 1; }
          printf '%s' "$response" | python3 -c '
          import json, os, sys
          try:
              data = json.load(sys.stdin)
              expected = os.environ["EXPECTED_SHA"]
              matching = [run for run in data.get("workflow_runs", [])
                          if isinstance(run, dict) and run.get("head_sha") == expected
                          and run.get("head_branch") == "main" and run.get("event") == "push"]
              latest = max(matching, key=lambda run: (int(run["id"]), int(run.get("run_attempt", 1))))
              ok = latest.get("status") == "completed" and latest.get("conclusion") == "success"
          except Exception:
              ok = False
          if not ok:
              print("The latest CI push run has not succeeded for this main revision.", file=sys.stderr)
              sys.exit(1)
          print("Successful CI verified for the selected revision.")
          '

      - name: Request Render deployment for this revision
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          hook = os.environ.get("RENDER_DEPLOY_HOOK", "")
          sha = os.environ["EXPECTED_SHA"]
          if not hook or not sha:
              print("The selected environment deploy hook is not configured.", file=sys.stderr)
              sys.exit(1)
          try:
              parts = urllib.parse.urlsplit(hook)
              if parts.scheme != "https" or not parts.netloc:
                  raise ValueError("invalid hook")
              query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
              query = [(key, value) for key, value in query if key != "ref"]
              query.append(("ref", sha))
              target = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path,
                                                urllib.parse.urlencode(query), ""))
              request = urllib.request.Request(target, method="POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  payload = response.read(8192)
              if status == 200:
                  body = json.loads(payload)
                  deploy = body.get("deploy", body)
                  deploy_id = deploy.get("id") if isinstance(deploy, dict) else None
                  if not deploy_id:
                      raise ValueError("missing deploy id")
                  print("Render accepted deployment request for the selected revision; deploy id: " + str(deploy_id))
              elif status == 202:
                  print("Render queued the selected revision behind an active deployment; no deploy id was returned.")
              else:
                  print("Render did not accept the deployment request.", file=sys.stderr)
                  sys.exit(1)
          except Exception:
              print("Could not request the deployment.", file=sys.stderr)
              sys.exit(1)
          PY
