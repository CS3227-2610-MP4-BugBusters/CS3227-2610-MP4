name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend ${{ matrix.frontend }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        frontend: [developer, maintainer, shared/markdown]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/frontend/${{ matrix.frontend }}/package-lock.json
      - name: Install dependencies
        working-directory: src/frontend/${{ matrix.frontend }}
        if: matrix.frontend == 'shared/markdown'
        run: npm ci
      - name: Install shared Markdown dependency
        if: matrix.frontend != 'shared/markdown'
        working-directory: src/frontend/shared/markdown
        run: npm ci
      - name: Install frontend dependencies
        if: matrix.frontend != 'shared/markdown'
        working-directory: src/frontend/${{ matrix.frontend }}
        run: npm ci
      - name: Typecheck, test and build
        run: python3 workflow/verify.py --group frontend --frontend ${{ matrix.frontend }}

  assigned-reports:
    name: Assigned reports / Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install PostgreSQL tools and JDBC driver
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpostgresql-jdbc-java libjackson2-databind-java
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Verify shared report migration
        if: matrix.java == '17'
        run: src/backend/shared/test/run-shared-report-storage.sh
      - name: Verify assigned reports with disposable PostgreSQL
        env:
          POSTGRES_JDBC_JAR: /usr/share/java/postgresql.jar
        run: src/backend/developer/test/run-assigned-reports.sh
      - name: Verify checklist Share and shared reads
        env:
          POSTGRES_JDBC_JAR: /usr/share/java/postgresql.jar
          JACKSON_CORE_JAR: /usr/share/java/jackson-core.jar
          JACKSON_DATABIND_JAR: /usr/share/java/jackson-databind.jar
          JACKSON_ANNOTATIONS_JAR: /usr/share/java/jackson-annotations.jar
        run: |
          bash src/backend/developer/test/run-checklist-share-service.sh mp4.developer.JdbcChecklistShareService src/backend/developer/src/JdbcChecklistShareService.java
          bash src/backend/developer/test/run-checklist-share-proposal-guard-regression.sh
          bash src/backend/developer/test/run-checklist-share-closure-race-regression.sh
          bash src/backend/developer/test/run-checklist-share-safe-version-regression.sh
          bash src/backend/developer/test/run-checklist-share-http.sh
          bash src/backend/developer/test/run-checklist-shared-read-http.sh

  auth-setup:
    name: Auth setup / Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install disposable PostgreSQL prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Verify isolated auth setup
        run: python3 workflow/verify.py --group backend

  reporter-api:
    name: Reporter API / Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the PostgreSQL JDBC driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libpostgresql-jdbc-java
      - name: Reporter migration and black-box API tests with disposable PostgreSQL
        env:
          POSTGRES_JDBC_JAR: /usr/share/java/postgresql.jar
        run: python workflow/verify.py --group reporter

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.16.0
      - name: Run repository tooling checks
        run: python3 workflow/verify.py --group tooling

  security:
    name: Release security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run repository security checks
        run: python3 workflow/verify.py --group security

  application-image:
    name: Application image / Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable application image
        run: docker build --build-arg GITHUB_SHA="$GITHUB_SHA" --file src/backend/platform/deployment/Dockerfile --tag mp4-auth:ci .
      - name: Check packaged startup, frontend and build revision
        shell: bash
        run: |
          set -euo pipefail
          config="$(mktemp)"
          trap 'rm -f "$config"; docker rm -f mp4-image-app mp4-image-db >/dev/null 2>&1 || true; docker network rm mp4-image-check >/dev/null 2>&1 || true' EXIT
          password="$(openssl rand -hex 32)"
          limiter="$(openssl rand -hex 32)"
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_DB=mp4_image\nMP4_AUTH_JDBC_URL=jdbc:postgresql://mp4-image-db:5432/mp4_image\nMP4_AUTH_DB_USER=postgres\nMP4_AUTH_DB_PASSWORD=%s\nMP4_AUTH_RATE_LIMIT_SECRET=%s\n' "$password" "$password" "$limiter" > "$config"
          chmod 600 "$config"
          docker network create mp4-image-check >/dev/null
          docker run --detach --name mp4-image-db --network mp4-image-check --env-file "$config" postgres:17 >/dev/null
          ready=false
          for attempt in {1..30}; do
            if docker exec mp4-image-db pg_isready --username postgres --dbname mp4_image >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          "$ready" || { echo 'Disposable image database did not become ready.' >&2; exit 1; }
          docker run --detach --name mp4-image-app --network mp4-image-check --env-file "$config" --publish 127.0.0.1:18080:10000 mp4-auth:ci >/dev/null
          ready=false
          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:18080/api/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          "$ready" || { echo 'Packaged application did not become healthy.' >&2; exit 1; }
          curl --silent --show-error --fail http://127.0.0.1:18080/ | grep -q '<div id="root">'
          curl --silent --show-error --fail http://127.0.0.1:18080/developer/ | grep -q '/developer/assets/'
          actual="$(curl --silent --show-error --fail http://127.0.0.1:18080/assets/revision.txt)"
          test "$actual" = "$GITHUB_SHA"
          echo 'Packaged health, frontend and exact build revision passed.'
