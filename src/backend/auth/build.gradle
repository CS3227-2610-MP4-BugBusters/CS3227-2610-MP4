plugins {
    id 'java'
}

group = 'mp4'
version = '0.1.0-SNAPSHOT'

description = 'Authentication module and operator provisioning command'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java {
    srcDir '../platform/src/main/java'
    srcDir '../developer/src'
    srcDir '../reporter/src'
    srcDir '../discussion/src'
    srcDir '../maintainer/src/main/java'
    srcDir '../socllm/src/main/java'
    include 'mp4/**', 'AssignedReportStore.java', 'AssignedReportListHttpHandler.java', 'ChecklistDraftStore.java',
            'ChecklistShareService.java', 'JdbcChecklistShareService.java',
            'ChecklistShareHttpHandler.java', 'ChecklistSharedHttpHandler.java',
            'ChecklistDraftHttpHandler.java', 'SharedInvestigationNotesStore.java', 'ReporterReportStore.java',
            'ReporterReportsHttpHandler.java', 'socllm/**'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    from('../maintainer/src/main/resources/db/shared') {
        into 'db/shared'
    }
    from('../shared/migrations/001_create_reports.sql') {
        into 'db/shared'
        rename { 'V1__create_reports.sql' }
    }
    from('../developer/migrations/create_investigation_checklists.sql') {
        into 'db/shared'
        rename { 'V2__create_investigation_checklists.sql' }
    }
    from('../developer/migrations/create_developer_private_notes.sql') {
        into 'db/shared'
        rename { 'V6__create_developer_private_notes.sql' }
    }
    from('../developer/migrations/create_developer_notifications.sql') {
        into 'db/shared'
        rename { 'V7__create_developer_notifications.sql' }
    }
    from('../developer/migrations/create_developer_shared_notes.sql') {
        into 'db/shared'
        rename { 'V8__create_developer_shared_notes.sql' }
    }
    from('../socllm/src/main/resources/db/socllm') {
        into 'db/socllm'
    }

}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--add-modules=jdk.httpserver'
    doFirst { systemProperty 'mp4.auth.command.classpath', sourceSets.main.runtimeClasspath.asPath }
    // Each setup run owns a new database; never reuse a result from an older one.
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('Disposable database setup must execute on every run') { true }
}

tasks.register('provisionAccount', JavaExec) {
    description = 'Runs the team-operated account provisioning command'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mp4.auth.AccountProvisioningCommand'
    standardInput = System.in
}

tasks.register('runAuth', JavaExec) {
    description = 'Runs the shared authentication web application'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mp4.platform.AuthApplication'
    jvmArgs '--add-modules=jdk.httpserver'
}
