schema: spec-driven

context: |
  MP4 is a new project; previous MPs must not supply application implementation.
  Application AI must use SoC LLM. Team-managed deployment must separate development
  and production; agent-provided build-and-host services are prohibited.
  OpenSpec complements the team's specialized-agent workflow; it does not replace
  the independently verified Red baseline or feature-owner approval before Green.

operations:
  apply:
    guidance:
      - Follow AGENTS.md and workflow/tdd.md, including the configured agent roles.
      - Obtain feature-owner approval of the independently verified Red baseline before implementation.
      - Keep synthetic UI results distinct from real authentication, persistence and AI verification.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
